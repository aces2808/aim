[DEFAULT]
# Project Configuration
project_name = mib27a
environment = dev

[S3]
# S3 Bucket Configuration - names auto-generated from project_env
default_root_object = index.html
error_page_path = /index.html

[CloudFront]
# CloudFront Distribution Configuration
comment = CloudFront distribution for static website
price_class = PRICE_CLASS_100
oac_description = OAC for static website bucket

[IAM]
# IAM Policy Configuration
policy_action = s3:GetObject

[Outputs]
# CloudFormation Output Descriptions
bucket_name_description = S3 bucket name for static website content
distribution_id_description = CloudFront distribution ID
distribution_domain_description = CloudFront distribution domain name
website_url_description = Website URL

[Timeouts]
# Error response TTL in minutes
error_response_ttl_minutes = 5
