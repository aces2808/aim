<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agriyard - Page Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }

      .error-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 50px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 20px;
      }

      .error-code {
        font-size: 6em;
        font-weight: bold;
        color: #2c5aa0;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
      }

      .error-message {
        font-size: 1.5em;
        margin-bottom: 30px;
        color: #666;
      }

      .error-description {
        margin-bottom: 30px;
        line-height: 1.6;
        color: #777;
      }

      .home-button {
        display: inline-block;
        background: linear-gradient(135deg, #2c5aa0 0%, #1e3d72 100%);
        color: white;
        padding: 15px 30px;
        text-decoration: none;
        border-radius: 25px;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(44, 90, 160, 0.3);
      }

      .home-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(44, 90, 160, 0.4);
      }

      .logo {
        font-size: 1.5em;
        font-weight: bold;
        color: #2c5aa0;
        margin-bottom: 30px;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="logo">🐄 Agriyard</div>
      <div class="error-code">404</div>
      <div class="error-message">Page Not Found</div>
      <div class="error-description">
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <p>
          This could be a client-side route that will be handled by the main
          application.
        </p>
      </div>
      <a href="/" class="home-button">Go to Homepage</a>
    </div>

    <script>
      // Auto-redirect to home page after 5 seconds
      setTimeout(() => {
        window.location.href = "/";
      }, 5000);

      // For SPA applications, you might want to handle routing here
      console.log("Error page loaded. Redirecting to home in 5 seconds...");
    </script>
  </body>
</html>
