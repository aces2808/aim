[DEFAULT]
# Project Configuration
project_name = epocket
environment = dev

[VPC]
# VPC Configuration - only essential values, names auto-generated from project_name
cidr_block = 192.168.0.0/16
max_azs = 2

[RouteTable]
# Public Route Table Configuration
public_route_destination = 0.0.0.0/0

[Subnets]
# Public Subnet Configuration - names and IDs auto-generated
pubsubnet1_cidr = 192.168.0.0/24
pubsubnet1_az = ap-southeast-1a

pubsubnet2_cidr = 192.168.1.0/24
pubsubnet2_az = ap-southeast-1b

map_public_ip_on_launch = True

# Private Subnet Configuration (for Fargate + RDS, no internet route)
privsubnet1_cidr = 192.168.2.0/24
privsubnet1_az = ap-southeast-1a

privsubnet2_cidr = 192.168.3.0/24
privsubnet2_az = ap-southeast-1b

